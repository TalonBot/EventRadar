name: Preverjanje projekta

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Struktura in dokumentacija
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prenos repozitorija
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Preverjanje strukture in dokumentacije
        run: python scripts/check_project.py
